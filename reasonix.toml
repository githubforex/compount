{'Authorization': 'Bearer ' + key})\n    try:\n        r = urllib.request.urlopen(req, timeout=20)\n        print('MODELS', path, 'HTTP', r.status)\n        print(r.read().decode('utf-8')[:1500])\n        break\n    except urllib.error.HTTPError as e:\n        print('MODELS', path, 'HTTP', e.code, e.read().decode('utf-8')[:200])\n    except Exception as e:\n        print('MODELS', path, 'ERR', type(e).__name__, repr(e)[:200])\n\")", "Bash(cd /f/Code/compount && ARK_API_KEY='***REDACTED***' python -c \"\nimport urllib.request, json, os\nkey = os.environ['ARK_API_KEY']\nreq = urllib.request.Request('https://ark.cn-beijing.volces.com/api/v3/models', headers={'Authorization': 'Bearer ' + key})\ndata = json.loads(urllib.request.urlopen(req, timeout=20).read().decode('utf-8'))\nmodels = data.get('data', [])\nprint('总数:', len(models))\nprint('--- seed 相关模型 ---')\nfor m in models:\n    mid = m.get('id','')\n    if 'seed' in mid.lower():\n        print(mid, '| status=', m.get('status'), '| modalities=', m.get('modalities'))\nprint('--- 含 vision 的模型 ---')\nfor m in models:\n    mid = m.get('id','')\n    mod = m.get('modalities') or {}\n    if 'vision' in str(mid).lower() or 'image' in str(mod):\n        print(mid, '| modalities=', mod)\n\")", "Bash(cd /f/Code/compount && ARK_API_KEY='***REDACTED***' python -c \"\nimport sys, io, json, base64, urllib.request, os\nsys.stdout.reconfigure(encoding='utf-8')\nfrom PIL import Image, ImageDraw, ImageFont\n\n# 1) 画一张模拟成交记录表格\ntry:\n    font = ImageFont.truetype(r'C:\\Windows\\Fonts\\msyh.ttc', 26)\n    small = ImageFont.truetype(r'C:\\Windows\\Fonts\\msyh.ttc', 22)\nexcept Exception:\n    font = ImageFont.load_default(); small = font\n\nheaders = ['合约', '开平', '成交价', '成交量', '成交时间']\nrows = [\n    ['rb2510', '开仓', '3150', '2', '09:30:01'],\n    ['rb2510', '平仓', '3155', '1', '09:31:15'],\n    ['i2509',  '开仓', '788.5', '3', '10:02:33'],\n    ['au2512', '平仓', '610.02', '1', '11:00:45'],\n]\ncol_w = [150, 110, 130, 130, 200]\nrow_h = 46\nW = sum(col_w); H = row_h*(len(rows)+1)\nimg = Image.new('RGB', (W, H), 'white')\nd = ImageDraw.Draw(img)\ny = 0\nx = 0\nfor h in headers:\n    d.rectangle([x,0,x+col_w[0],row_h] if False else [x,0,x+col_w[headers.index(h)],row_h], outline='black')\n    d.text((x+12, 10), h, fill='black', font=font)\n    x += col_w[headers.index(h)]\n# 修正表头绘制\nd = ImageDraw.Draw(img)\ny = 0\nx = 0\nfor h in headers:\n    cw = col_w[headers.index(h)]\n    d.rectangle([x, y, x+cw, y+row_h], outline='black', width=2)\n    d.text((x+12, y+10), h, fill='black', font=font)\n    x += cw\ny += row_h\nfor r in rows:\n    x = 0\n    for i, cell in enumerate(r):\n        cw = col_w[i]\n        d.rectangle([x, y, x+cw, y+row_h], outline='black', width=2)\n        d.text((x+12, y+11), cell, fill='black', font=small)\n        x += cw\n    y += row_h\n\nbuf = io.BytesIO(); img.save(buf, format='PNG')\nb64 = base64.b64encode(buf.getvalue()).decode()\n\n# 2) 调用豆包 vision 识别\nkey = os.environ['ARK_API_KEY']\nbody = {\n    'model': 'doubao-seed-2-0-lite-260428',\n    'messages': [{'role':'user','content':[\n        {'type':'text','text':'这是一张期货成交记录截图。请识别其中的表格数据，输出 JSON 数组，每行包含字段 contract(合约), side(开平,只填 开/平), price(成交价,数字), volume(成交量,数字), time(成交时间,HH:MM:SS)。只输出 JSON，不要解释。'},\n        {'type':'image_url','image_url':{'url':'data:image/png;base64,'+b64}}\n    ]}],\n    'max_tokens': 800\n}\nreq = urllib.request.Request('https://ark.cn-beijing.volces.com/api/v3/chat/completions',\n    data=json.dumps(body).encode('utf-8'),\n    headers={'Authorization':'Bearer '+key,'Content-Type':'application/json'})\ntry:\n    r = urllib.request.urlopen(req, timeout=60)\n    resp = json.loads(r.read().decode('utf-8'))\n    msg = resp['choices'][0]['message']\n    print('=== content ===')\n    print(msg.get('content'))\n    print('=== reasoning (前200) ===')\n    print((msg.get('reasoning_content') or '')[:200])\n    print('=== usage ===')\n    print(resp.get('usage'))\nexcept urllib.error.HTTPError as e:\n    print('HTTP